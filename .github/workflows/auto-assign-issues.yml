name: Issue/PR assignment

on:
    issues:
        types: [opened]
    pull_request_target:
        types: [opened] #edited, synchronize, reopened

jobs:
    auto-assign:
        runs-on: ubuntu-latest
        permissions:
            issues: write
            pull-requests: write
        steps:
            - name: 'Auto-assign issue/PR'
              uses: pozil/auto-assign-issue@v4
              with:
                  assignees: XeroxQ
                  numOfAssignee: 1
                  allowSelfAssign: true
                  repo-token: ${{ secrets.PAT }}
